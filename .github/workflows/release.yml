name: Sign and release

# A pushed version tag packs the package with Unity's UPM CLI, which signs the tarball
# for the Birr Studio organization (package/.attestation.p7m inside it), and attaches the
# signed .tgz to a GitHub Release of the same tag. OpenUPM tracks the release asset
# (trackingMode: githubRelease), so the tarball a consumer installs is the one signed here.
# The packed package.json carries the tag's CHANGELOG section as _upm.changelog and a
# changelogUrl pointing at the tag.
# Run by hand with a tag, it packs that tag again and replaces the release's tarball.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to pack again"
        required: true

permissions:
  contents: write

jobs:
  sign:
    name: Sign UPM package
    runs-on: ubuntu-latest
    env:
      UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
      UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
      UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DIST_DIR: /tmp/signed-upm-dist

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check that package.json carries the tag's version
        run: |
          package_name="$(jq -r '.name' package.json)"
          package_version="$(jq -r '.version' package.json)"

          if [ "$package_version" != "$RELEASE_TAG" ]; then
            printf 'package.json says %s but the tag is %s\n' "$package_version" "$RELEASE_TAG" >&2
            exit 1
          fi

          echo "PACKAGE_NAME=$package_name" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          printf 'Packing %s@%s\n' "$package_name" "$package_version"

      # FlowIoC names no render pipeline. A pipeline among the dependencies, or a pipeline's camera
      # data, light data or default material in a shipped module, would bring that pipeline into
      # every project that installs the package - an HDRP game got URP's settings that way. The
      # host publishes modules without URP's camera and light data; this stops whatever got past.
      - name: Check that the package names no render pipeline
        run: |
          if jq -e '.dependencies // {} | has("com.unity.render-pipelines.universal") or has("com.unity.render-pipelines.high-definition")' package.json > /dev/null; then
            echo 'package.json depends on a render pipeline' >&2
            exit 1
          fi

          # URP's camera and light data and Lit material, then HDRP's camera and light data and
          # default material.
          pipeline_guids='a79441f348de89743a2939f4d699eac1|474bcb49853aa07438625e644c072ee6|31321ba15b8f8eb4c954353edc038b1d|23c1ce4fb46143f46bc5cb5224c934f6|7a68c43fe1f2a47cfa234b5eeaa98012|73c176f402d2c2f4d929aa5da7585d17'
          found="$(grep -rlE "$pipeline_guids" 'Modules~' 'SetupModules~' || true)"
          if [ -n "$found" ]; then
            printf 'A shipped module names a render pipeline:\n%s\n' "$found" >&2
            exit 1
          fi

      # The Package Manager shows a version's notes in Version History only from package.json's
      # _upm.changelog - it never reads CHANGELOG.md - and its Changelog link opens changelogUrl.
      # Both are written into the packed package.json from the tag's own CHANGELOG section, so
      # each version's row shows its own notes and links its own tag rather than master.
      - name: Write the version's notes into package.json
        run: |
          awk -v v="$PACKAGE_VERSION" '
            index($0, "## [" v "]") == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md \
            | awk '
                /^  +[^ ]/ && held != "" { sub(/^ +/, ""); held = held " " $0; next }
                NR > 1 { print held }
                { held = $0 }
                END { print held }
              ' \
            | sed 's/\*\*//g' > /tmp/release-notes.md

          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            printf 'CHANGELOG.md has no section for %s\n' "$PACKAGE_VERSION" >&2
            exit 1
          fi

          jq --rawfile notes /tmp/release-notes.md \
             --arg url "https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/CHANGELOG.md" \
             '."_upm".changelog = ($notes | gsub("^[[:space:]]+|[[:space:]]+$"; "")) | .changelogUrl = $url' \
             package.json > /tmp/package.json
          mv /tmp/package.json package.json
          jq '{changelogUrl, "_upm"}' package.json

      # The installer is fetched outside the checkout: upm pack takes every file it finds
      # under the package root, and a stray file with no .meta warns at every consumer's import.
      - name: Install Unity UPM CLI
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh -o /tmp/upm-install.sh
          bash /tmp/upm-install.sh
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"

      - name: Pack and sign
        run: |
          mkdir -p "$DIST_DIR"
          upm pack . --organization-id "$UPM_ORG_ID" --destination "$DIST_DIR"

      - name: Verify the signed tarball
        run: |
          shopt -s nullglob
          archives=("$DIST_DIR"/*.tgz "$DIST_DIR"/*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            printf 'Expected exactly one archive, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi
          archive="${archives[0]}"

          tar -tzf "$archive" | grep -qx 'package/package.json'
          tar -tzf "$archive" | grep -qx 'package/.attestation.p7m'
          tar -xOzf "$archive" package/package.json | jq -e --arg v "$PACKAGE_VERSION" '.version == $v' > /dev/null
          tar -xOzf "$archive" package/package.json \
            | jq -e --arg t "/blob/$RELEASE_TAG/" '(."_upm".changelog | length > 0) and (.changelogUrl | contains($t))' > /dev/null

          # The tarball holds every file git tracks, apart from the repository's own dotfiles,
          # and nothing else: an untracked file has no .meta, and Unity warns about it at import.
          tar -tzf "$archive" | sed 's#^package/##' | grep -v '/$' | sort > /tmp/tarball.txt
          git ls-files | grep -v -E '^(\.github/|\.gitignore$|\.npmignore$)' | sort > /tmp/tracked.txt
          missing="$(comm -23 /tmp/tracked.txt /tmp/tarball.txt)"
          if [ -n "$missing" ]; then
            printf 'Tracked files missing from the tarball:\n%s\n' "$missing" >&2
            exit 1
          fi
          extra="$(comm -13 /tmp/tracked.txt /tmp/tarball.txt | grep -v '^\.attestation\.p7m$' || true)"
          if [ -n "$extra" ]; then
            printf 'Untracked files in the tarball:\n%s\n' "$extra" >&2
            exit 1
          fi

          echo "PACKAGE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          printf 'Signed %s (%s files)\n' "$(basename "$archive")" "$(wc -l < /tmp/tarball.txt)"

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.PACKAGE_VERSION }}
          body: |
            Signed UPM tarball of `${{ env.PACKAGE_NAME }}@${{ env.PACKAGE_VERSION }}`.
            What changed is in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ env.PACKAGE_VERSION }}/CHANGELOG.md).
          files: ${{ env.PACKAGE_ARCHIVE }}
